<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0d18; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters for glowing cyber effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .shield-beam {
        animation: beamMove 5s linear infinite;
      }
      .particle {
        animation: float 6s ease-in-out infinite alternate;
      }
      .particle-slow {
        animation: float 9s ease-in-out infinite alternate-reverse;
      }
      .scan-line {
        animation: scan 8s linear infinite;
      }
      .chip-flow {
        stroke-dasharray: 8 16;
        animation: flowDash 3s linear infinite;
      }

      @keyframes pulse {
        0% { transform: scale(0.97); opacity: 0.35; }
        100% { transform: scale(1.03); opacity: 0.75; }
      }
      @keyframes beamMove {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes float {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-12px) translateX(8px); opacity: 0.6; }
        100% { transform: translateY(6px) translateX(-6px); opacity: 0.3; }
      }
      @keyframes scan {
        0% { transform: translateY(-50px); opacity: 0; }
        30% { opacity: 0.4; }
        70% { opacity: 0.4; }
        100% { transform: translateY(380px); opacity: 0; }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -48; }
      }
    </style>
  </defs>

  <!-- Background base -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>

  <!-- Cyber Grid Pattern (Subtle) -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="720" y1="0" x2="720" y2="360"/>
    <line x1="840" y1="0" x2="840" y2="360"/>
    <line x1="960" y1="0" x2="960" y2="360"/>
    <line x1="1080" y1="0" x2="1080" y2="360"/>
  </g>

  <!-- Animated Glowing Background Elements (Behind text) -->
  <circle cx="950" cy="180" r="140" fill="#38bdf8" filter="url(#glow)" class="pulse-circle"/>
  <circle cx="200" cy="120" r="110" fill="#818cf8" filter="url(#glow)" class="pulse-circle" style="animation-delay:-2s;"/>

  <!-- Dynamic Security Circuit lines (Background) -->
  <g fill="none" stroke="#38bdf8" opacity="0.4" stroke-width="1.5">
    <path d="M 50 180 L 180 180 L 230 230 L 380 230" class="chip-flow"/>
    <circle cx="50" cy="180" r="4" fill="#38bdf8"/>
    <circle cx="380" cy="230" r="4" fill="#38bdf8"/>

    <path d="M 820 130 L 930 130 L 980 80 L 1150 80" class="chip-flow" style="animation-delay:-1s;"/>
    <circle cx="820" cy="130" r="4" fill="#818cf8"/>
    <circle cx="1150" cy="80" r="4" fill="#818cf8"/>

    <path d="M 850 280 L 960 280 L 1020 220 L 1140 220" class="chip-flow" style="animation-delay:-2s;"/>
    <circle cx="850" cy="280" r="4" fill="#c084fc"/>
    <circle cx="1140" cy="220" r="4" fill="#c084fc"/>
  </g>

  <!-- Animated floating cybersecurity particles (Background) -->
  <g fill="#38bdf8" opacity="0.5">
    <circle cx="140" cy="80" r="3" class="particle"/>
    <circle cx="310" cy="290" r="2.5" class="particle-slow"/>
    <circle cx="880" cy="70" r="3.5" class="particle"/>
    <circle cx="1060" cy="300" r="2" class="particle-slow"/>
    <circle cx="750" cy="320" r="2.5" class="particle"/>
    <circle cx="80" cy="300" r="3" class="particle-slow"/>
  </g>

  <!-- Scanning laser line -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#glowGrad)" class="scan-line"/>

  <!-- Foreground Shield Emblem (Right Side) -->
  <g transform="translate(920, 105)" filter="url(#glow)">
    <!-- Outer Shield Contour -->
    <path d="M70,10 L130,35 C130,110 70,150 70,150 C70,150 10,110 10,35 Z" 
          fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
    <!-- Inner Shield Gradient -->
    <path d="M70,18 L122,39 C122,103 70,138 70,138 C70,138 18,103 18,39 Z" 
          fill="url(#accentCyan)"/>
    <!-- Keyhole / Trust Checkmark Symbol -->
    <path d="M50,75 L64,89 L92,57" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- FOREGROUND TEXT (Always crisp and visible on top) -->
  <g id="foreground-content">
    <!-- Badge Pill -->
    <rect x="80" y="48" width="230" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9"/>
    <circle cx="96" cy="63" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="110" y="68" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">ZERO TRUST SECURITY</text>

    <!-- Main Title -->
    <text x="80" y="132" fill="url(#primaryGrad)" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Zero Trust
    </text>
    <text x="80" y="180" fill="#ffffff" font-size="38" font-weight="800" letter-spacing="-0.5">
      Security Architecture
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="80" y="224" fill="#94a3b8" font-size="16" font-weight="400">
      Never Trust, Always Verify — Curated ZTNA, SSE, SDP &amp; Identity-Centric Solutions
    </text>

    <!-- Bottom Feature Tags -->
    <g transform="translate(80, 260)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="18" fill="#38bdf8" font-size="12" font-weight="600">🛡️ Identity-Centric</text>

      <!-- Tag 2 -->
      <rect x="145" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="159" y="18" fill="#a855f7" font-size="12" font-weight="600">⚡ Least Privilege</text>

      <!-- Tag 3 -->
      <rect x="285" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="299" y="18" fill="#10b981" font-size="12" font-weight="600">🌐 SASE &amp; ZTNA Stack</text>

      <!-- Tag 4 -->
      <rect x="440" y="0" width="165" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="454" y="18" fill="#f59e0b" font-size="12" font-weight="600">🚀 Open-Source &amp; SaaS</text>
    </g>
  </g>
</svg>
